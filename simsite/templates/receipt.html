{% extends "base.html" %}
{% block title %}申报回执{% endblock %}
{% block body %}
<div class="card" style="max-width:560px;margin:30px auto;text-align:center">
  <h2>{% if duplicate %}该单已申报（幂等返回原回执）{% else %}申报提交成功{% endif %}</h2>
  <p style="font-size:15px">业务编号：<b>{{ ref_no }}</b></p>
  <p style="font-size:22px;color:var(--ok);letter-spacing:1px">申报回执号：{{ sim_ref }}</p>
  {% if duplicate %}<p class="tag err">重复提交已被拦截，未产生第二份申报</p>{% endif %}
  <p style="margin-top:22px">
    <a class="btn" href="{{ url_for('decl_detail', sim_ref=sim_ref) }}">查看申报数据</a>
    <a class="btn gray" href="{{ url_for('decl_new') }}">继续录入下一单</a>
  </p>
</div>
{% endblock %}
